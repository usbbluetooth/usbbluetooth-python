[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "usbbluetooth"
dynamic = ["version"]
authors = [
  { name="Antonio Vázquez Blanco", email="antoniovazquezblanco@gmail.com" },
]
description = "Take full control of your USB Bluetooth controllers!"
readme = "README.md"
license = { text="GPL-3.0-only" }
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "Topic :: Security",
]
dependencies = [
    "pyusb>=1.1.0,<2"
]
keywords = [ "bluetooth" ]

[project.optional-dependencies]
test = [
    "pytest>=7.0"
]

[project.urls]
"Homepage" = "https://usbbluetooth.github.io/"
"Bug Tracker" = "https://github.com/usbbluetooth/usbbluetooth-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/usbbluetooth"]

[tool.hatch.version]
source = "vcs"

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ is not a package: this puts it on sys.path so conftest can import
# the fake backend directly.
pythonpath = ["tests"]
markers = [
    "hardware: needs a real USB Bluetooth controller (opt in with --hardware)",
]
